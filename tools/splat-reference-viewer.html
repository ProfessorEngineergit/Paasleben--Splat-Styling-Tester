<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paasleben · KSplat Referenzaufnahme</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182a26; }
      #viewport, #viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed; left: 18px; top: 18px; z-index: 10; min-width: 290px;
        padding: 14px 16px; border: 1px solid rgba(255,255,255,.24); border-radius: 10px;
        color: #f8f2df; background: rgba(17,31,28,.82); backdrop-filter: blur(12px);
        box-shadow: 0 12px 36px rgba(0,0,0,.25); pointer-events: none;
      }
      #hud strong { display: block; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
      #view-name { display: block; margin-top: 5px; font-size: 12px; opacity: .82; }
      #metrics { display: block; margin-top: 6px; font: 11px/1.4 ui-monospace, SFMono-Regular, monospace; opacity: .74; }
      #status { display: block; margin-top: 7px; font-size: 11px; color: #ffd487; }
      .clean #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <aside id="hud">
      <strong>Paasleben KSplat</strong>
      <span id="view-name">wird geladen …</span>
      <span id="metrics"></span>
      <span id="status">530.407 Splats werden geladen</span>
    </aside>
    <script type="module" src="/tools/splat-reference-viewer.js"></script>
  </body>
</html>
